<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuantEcon — ALM Study Notes</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"IBM Plex Sans",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:#0a0e1a;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2rem;
    position:relative;overflow:hidden;
  }

  /* animated background blobs */
  body::before,body::after{
    content:"";position:absolute;border-radius:50%;pointer-events:none;
    animation:blob 18s ease-in-out infinite alternate;
  }
  body::before{
    width:700px;height:700px;top:-200px;left:-220px;
    background:radial-gradient(circle, rgba(6,182,212,.18), transparent 70%);
  }
  body::after{
    width:600px;height:600px;bottom:-180px;right:-200px;animation-duration:24s;
    background:radial-gradient(circle, rgba(16,185,129,.14), transparent 70%);
  }
  @keyframes blob{0%{transform:translate(0,0) scale(1);}100%{transform:translate(40px,30px) scale(1.1);}}

  h1{
    font-size:1.9rem;font-weight:300;color:#f0f4ff;
    letter-spacing:-.01em;margin-bottom:.4rem;text-align:center;
  }
  h1 strong{font-weight:600;color:#67e8f9;}
  .sub{font-size:.85rem;color:rgba(103,232,249,.5);font-family:"IBM Plex Mono",monospace;
       text-align:center;margin-bottom:3rem;letter-spacing:.04em;text-transform:uppercase;}

  .grid{
    display:flex;gap:1.25rem;flex-wrap:wrap;justify-content:center;
    position:relative;z-index:1;
  }

  .card{
    width:280px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(6,182,212,.18);
    border-radius:4px;padding:2rem 1.75rem 1.5rem;
    text-decoration:none;color:#f0f4ff;
    display:flex;flex-direction:column;gap:.75rem;
    transition:background .2s,border-color .2s;
    will-change:transform;
    transform-style:preserve-3d;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(6,182,212,.12), transparent 60%);
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .card:hover::before{opacity:1;}
  .card:hover{background:rgba(6,182,212,.07);border-color:rgba(6,182,212,.4);}

  .card-num{
    font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.08em;
    color:rgba(103,232,249,.4);
  }
  .card h2{font-size:1.05rem;font-weight:500;line-height:1.3;color:#e0f7fa;}
  .card p{font-size:.82rem;color:rgba(103,232,249,.55);line-height:1.5;flex:1;}
  .card-arrow{
    display:flex;align-items:center;gap:.4rem;
    font-size:.78rem;font-family:"IBM Plex Mono",monospace;
    color:rgba(103,232,249,.45);margin-top:.5rem;
    transition:color .15s,gap .15s;
  }
  .card:hover .card-arrow{color:#67e8f9;gap:.65rem;}
  .card-arrow svg{flex-shrink:0;}

  footer{
    margin-top:3.5rem;font-size:.7rem;font-family:"IBM Plex Mono",monospace;
    color:rgba(103,232,249,.25);letter-spacing:.04em;
  }

  @media(max-width:640px){
    h1{font-size:1.4rem;}
    .card{width:100%;max-width:340px;}
  }
  @media(prefers-reduced-motion:reduce){
    body::before,body::after{animation:none;}
    .card{transition:none;}
  }
</style>
</head>
<body>

<h1>Working through <strong>QuantEcon</strong></h1>
<p class="sub">ALM · Retirement · Study Notes</p>

<div class="grid" id="grid">

  <a class="card" href="quantecon-chapters-for-alm-retirement-investment.html">
    <h2>Asset &amp; Liability Management</h2>
    <p>Curated lectures on savings, consumption smoothing, and retirement investing.</p>
    <span class="card-arrow">
      Open list
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5"/></svg>
    </span>
  </a>

</div>

<footer><a href="https://quantecon.org" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(103,232,249,.25);">quantecon.org</a> · personal project</footer>

<script>
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const mx = (x / r.width) * 100, my = (y / r.height) * 100;
      card.style.setProperty('--mx', mx + '%');
      card.style.setProperty('--my', my + '%');
      const rx = (my - 50) * 0.12, ry = (50 - mx) * 0.12;
      card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(8px)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  });
</script>

</body>
</html>
